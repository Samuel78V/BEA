<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños!</title>
  
  <style>
    /* RESET BÁSICO */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* CONTENEDOR PRINCIPAL */
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background-color: #0f172a;
      color: #333333;
      overflow-x: hidden;
    }

    /* CAPA DE IMAGEN DE FONDO CON OPACIDAD */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=1200'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.35; 
      z-index: 1;
    }

    /* TARJETA DE CONTENIDO */
    .contenedor-galeria {
      position: relative;
      z-index: 10;
      background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      max-width: 600px;
      width: 100%;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-align: center;
      animation: fadeIn 0.6s ease-out forwards;
    }

    h1 {
      font-size: 1.7rem;
      color: #1e293b;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 20px;
    }

    /* REPRODUCTOR DE MÚSICA CUSTOM */
    .seccion-musica {
      margin: 20px 0 25px 0;
      padding: 15px;
      background: rgba(241, 245, 249, 0.8);
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .seccion-musica label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    /* ÁREA DE FOTOS */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .foto-item {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .foto-item:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    /* ANIMACIÓN DE ENTRADA */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

 <div class="contenedor-galeria">
  <h1>¡Feliz Cumpleaños! 🎂</h1>
  <!-- REPRODUCTOR DE MÚSICA -->
  <div class="seccion-musica">
    <label>🎵 Felicidades</label>
    <audio controls loop>
      <source src="cancion.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

  <!-- GALERÍA DE FOTOS DE ELLA -->
  <div class="galeria-grid">
    <img class="foto-item" src="foto1.jpg" alt="Foto 1">
    <img class="foto-item" src="foto2.jpg" alt="Foto 2">
    <img class="foto-item" src="foto3.jpg" alt="Foto 3">
    <img class="foto-item" src="foto4.jpg" alt="Foto 4">
    <img class="foto-item" src="foto5.jpg" alt="Foto 5">
    <img class="foto-item" src="foto6.jpg" alt="Foto ">
  </div>
</div>
